name: Build and publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

# Serialise builds per ref. Without this, two ``main`` commits landing
# back-to-back kick off two parallel builds; whichever finishes second
# wins the mutable ``:main`` tag, regardless of git commit order. We
# observed this on 2026-05-06 (issue #268): the older commit's build
# completed slightly later and overwrote the ``:main`` tag, sending
# stale code to prod on the next ``docker compose pull``.
#
# ``cancel-in-progress: false`` keeps the older build running so we
# still get a ``:<sha>`` tag for it (useful for rollback / audit);
# the newer build queues up and pushes its tag last → ``:main``
# always reflects the latest commit.
concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=ref,event=branch
            type=ref,event=tag

      # Build LOCALLY first and prove the image boots before anything is
      # published (#784). A green build says the layers assembled, not that the
      # app imports: on 2026-07-28 an unpinned `mcp>=1.0.0` let the builder pull
      # mcp 2.0.0, which removed `mcp.server.fastmcp`. Every image published for
      # the next 11 days was unbootable and this workflow reported success for
      # all of them, because building never imports the app. Production survived
      # only because its tag happened to be pinned to the last good build; the
      # 2026-08-08 image was caught by a manual probe minutes before a restart.
      #
      # The runner is arm64 and we target linux/arm64, so `load: true` gives a
      # runnable image. The push step below is a cache hit, not a rebuild.
      - name: Build for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: false
          load: true
          tags: smoke-test:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test — the image must import the app
        run: |
          set -euo pipefail
          # Imports the FastAPI app, which transitively pulls in the config,
          # the DB schema and the MCP server build — i.e. everything that runs
          # before the process can serve a request.
          docker run --rm --entrypoint python "smoke-test:${{ github.sha }}" -c "
          import mcp.server.fastmcp
          import src.api.main
          import src.mcp_server
          print('smoke test OK')
          "

      - name: Push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
