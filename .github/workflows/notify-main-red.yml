name: Notify on main going red

# `Tests` was red on main for 11 days — 2026-07-28 to 2026-08-08 — and nobody
# noticed (#784). Four consecutive failing runs produced no signal anyone acted
# on. The household gets Telegram pings for tariff transitions and plan
# revisions, but not for the repo that drives them being broken.
#
# This reuses the same bot as the app's own notifications. It is INERT until
# TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID exist as repository secrets — the
# step exits 0 with a note rather than failing, so a fresh clone or a fork
# doesn't get a red X for a missing credential it was never meant to have.

on:
  # Manually runnable so the wire can be proven without breaking main — the
  # whole point of this workflow is that it fires on a day nobody is watching,
  # which is the worst day to discover the credentials were never right.
  workflow_dispatch:
  workflow_run:
    workflows: ["Tests", "Build and publish Docker image"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  notify:
    # Real runs: only failures. Manual runs have no workflow_run payload, so
    # they always proceed — that IS the test.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'failure'
    runs-on: ubuntu-latest
    steps:
      - name: Send Telegram alert
        env:
          TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WF: ${{ github.event.workflow_run.name || 'TESTE MANUAL' }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          URL: ${{ github.event.workflow_run.html_url || format('{0}/{1}/actions', github.server_url, github.repository) }}
          MSG: ${{ github.event.workflow_run.head_commit.message || 'Verificação manual do alerta de CI — nada está quebrado.' }}
          IS_TEST: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          if [ -z "${TOKEN}" ] || [ -z "${CHAT_ID}" ]; then
            echo "TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID not set — alert skipped."
            echo "Add them as repository secrets to activate (see #784)."
            exit 0
          fi
          # First line of the commit message only; the rest is noise on a phone.
          subject=$(printf '%s' "${MSG}" | head -1)
          # A manual run must be unmistakably a drill. Sending a red "failed on
          # main" for a test would teach the reader to distrust the alert, which
          # is the same end state as having no alert.
          if [ "${IS_TEST}" = "true" ]; then
            headline='🧪 teste do alerta de CI — nada quebrado'
          else
            headline="🔴 ${WF} falhou no main"
          fi
          text=$(printf '<b>%s</b>\n<code>%s</code>\n%s\n\n%s' \
                 "${headline}" "${SHA:0:8}" "${subject}" "${URL}")
          code=$(curl -s -o /tmp/tg.out -w '%{http_code}' \
            --max-time 15 \
            -X POST "https://api.telegram.org/bot${TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${CHAT_ID}" \
            --data-urlencode "text=${text}" \
            --data-urlencode "parse_mode=HTML")
          if [ "${code}" != "200" ]; then
            echo "Telegram returned HTTP ${code}:" >&2
            cat /tmp/tg.out >&2
            exit 1
          fi
          echo "alert sent"
